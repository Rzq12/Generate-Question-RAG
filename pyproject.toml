[project]
name = "generate-soal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "pydantic-settings>=2.0", "pillow>=10.0", "pymupdf>=1.24", "psycopg[binary]>=3.2", "fastapi>=0.115", "python-multipart>=0.0.9", "docling>=2.43", "rapidocr-onnxruntime>=1.4", "sentence-transformers>=3.0", "faiss-cpu>=1.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]
