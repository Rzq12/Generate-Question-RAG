services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_DSN: postgresql://generate_soal:generate_soal@postgres:5432/generate_soal
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      IMAGE_ANALYSIS_MODE: ${IMAGE_ANALYSIS_MODE:-ocr}
      OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
      EXTERNAL_IMAGE_API_ALLOWED: ${EXTERNAL_IMAGE_API_ALLOWED:-false}
      API_KEY: ${API_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      FAISS_INDEX_PATH: /workspace/data/faiss
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Materi:/workspace/Materi:ro
      - hf_cache:/root/.cache/huggingface
      - faiss_data:/workspace/data/faiss
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: generate_soal
      POSTGRES_USER: generate_soal
      POSTGRES_PASSWORD: generate_soal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U generate_soal -d generate_soal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
  hf_cache:
  faiss_data:
